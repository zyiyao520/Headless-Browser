name: Official Unikraft Baseline

on:
  workflow_dispatch:
    inputs:
      target:
        description: Baseline target to inspect or test
        required: true
        type: choice
        options:
          - quota
          - inspect-sources
          - novnc-browser
          - chromium-cdp-auth
      cleanup_after_test:
        description: Remove temporary cloud resources after test
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: official-unikraft-baseline
  cancel-in-progress: false

env:
  UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
  UKC_METRO: ${{ vars.UKC_METRO || 'fra' }}
  CDP_BOOTSTRAP_ADMIN_TOKEN: ${{ secrets.CDP_BOOTSTRAP_ADMIN_TOKEN }}
  KRAFTKIT_VERSION: "0.12.15"
  KRAFTKIT_NO_CHECK_UPDATES: "true"
  KRAFTKIT_NO_WARN_CLOUD_DEPRECATION: "1"

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$UKC_TOKEN" || {
            echo "::error::UKC_TOKEN is not configured"
            exit 1
          }
          if [[ "${{ inputs.target }}" == "chromium-cdp-auth" ]]; then
            test -n "$CDP_BOOTSTRAP_ADMIN_TOKEN" || {
              echo "::error::CDP_BOOTSTRAP_ADMIN_TOKEN is not configured"
              exit 1
            }
          fi

      - name: Install pinned KraftKit legacy CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="kraft_${KRAFTKIT_VERSION}_linux_${arch}.tar.gz"
          url="https://github.com/unikraft/kraftkit/releases/download/v${KRAFTKIT_VERSION}/${archive}"
          tmpdir="$(mktemp -d)"
          curl --fail --location --retry 3 --retry-all-errors -o "$tmpdir/$archive" "$url"
          tar -xzf "$tmpdir/$archive" -C "$tmpdir"
          kraft_source="$(find "$tmpdir" -type f -name kraft -perm -111 | head -n 1)"
          test -n "$kraft_source"
          install -d "$HOME/.local/bin"
          install -m 0755 "$kraft_source" "$HOME/.local/bin/kraft"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          kraft version

      - name: Clone official Unikraft examples
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 https://github.com/unikraft-cloud/examples.git /tmp/unikraft-examples
          git -C /tmp/unikraft-examples rev-parse HEAD | tee official-examples-revision.txt

      - name: Capture account quota and inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p baseline-artifacts
          kraft cloud quota -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" \
            | tee baseline-artifacts/quota.json
          kraft cloud image list -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" \
            | tee baseline-artifacts/images.json || true
          kraft cloud instance list -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" \
            | tee baseline-artifacts/instances.json || true
          kraft cloud volume list -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" \
            | tee baseline-artifacts/volumes.json || true
          kraft cloud service list -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" \
            | tee baseline-artifacts/services.json || true

      - name: Inspect official source files
        if: inputs.target != 'quota'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p baseline-artifacts/official-sources
          for project in novnc-browser chromium-cdp-auth chromium-cdp; do
            src="/tmp/unikraft-examples/$project"
            test -d "$src"
            mkdir -p "baseline-artifacts/official-sources/$project"
            cp -a "$src"/. "baseline-artifacts/official-sources/$project/"
            echo "===== $project ====="
            find "$src" -maxdepth 2 -type f -printf '%P\n' | sort
          done
          grep -RInE 'chrom(e|ium)|firefox|remote-debugging|headless|DISPLAY|token|Authorization|websocket|9222|6080' \
            baseline-artifacts/official-sources \
            | tee baseline-artifacts/source-findings.txt || true

      - name: Build official noVNC baseline
        if: inputs.target == 'novnc-browser'
        working-directory: /tmp/unikraft-examples/novnc-browser
        shell: bash
        run: |
          set -Eeuo pipefail
          kraft cloud deploy \
            --metro "$UKC_METRO" \
            --token "$UKC_TOKEN" \
            --name baseline-novnc-browser \
            --memory 4Gi \
            --port '443:6080/http+tls' \
            --restart on-failure \
            --rollout remove_sequential \
            --rollout-wait 90s \
            --output json \
            . | tee "$GITHUB_WORKSPACE/baseline-artifacts/novnc-deployment.json"
          kraft cloud instance get baseline-novnc-browser -o json \
            --metro "$UKC_METRO" --token "$UKC_TOKEN" \
            | tee "$GITHUB_WORKSPACE/baseline-artifacts/novnc-instance.json" || true
          kraft cloud image list -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" \
            | tee "$GITHUB_WORKSPACE/baseline-artifacts/images-after-novnc.json" || true

      - name: Build official authenticated CDP baseline
        if: inputs.target == 'chromium-cdp-auth'
        working-directory: /tmp/unikraft-examples/chromium-cdp-auth
        shell: bash
        run: |
          set -Eeuo pipefail
          volume=baseline-cdp-auth-data
          if ! kraft cloud volume get "$volume" -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" >/dev/null 2>&1; then
            kraft cloud volume create --name "$volume" --size 64Mi \
              --metro "$UKC_METRO" --token "$UKC_TOKEN"
          fi
          kraft cloud deploy \
            --metro "$UKC_METRO" \
            --token "$UKC_TOKEN" \
            --name baseline-chromium-cdp-auth \
            --memory 2Gi \
            --port '443:9223/http+tls' \
            --volume "$volume:/app/data" \
            --env "BOOTSTRAP_ADMIN_TOKEN=$CDP_BOOTSTRAP_ADMIN_TOKEN" \
            --restart on-failure \
            --rollout remove_sequential \
            --rollout-wait 90s \
            --output json \
            . | tee "$GITHUB_WORKSPACE/baseline-artifacts/cdp-auth-deployment.json"
          kraft cloud instance get baseline-chromium-cdp-auth -o json \
            --metro "$UKC_METRO" --token "$UKC_TOKEN" \
            | tee "$GITHUB_WORKSPACE/baseline-artifacts/cdp-auth-instance.json" || true
          kraft cloud image list -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" \
            | tee "$GITHUB_WORKSPACE/baseline-artifacts/images-after-cdp-auth.json" || true

      - name: Capture runtime logs
        if: always() && (inputs.target == 'novnc-browser' || inputs.target == 'chromium-cdp-auth')
        shell: bash
        run: |
          set +e
          if [[ "${{ inputs.target }}" == "novnc-browser" ]]; then
            name=baseline-novnc-browser
          else
            name=baseline-chromium-cdp-auth
          fi
          kraft cloud instance logs "$name" --metro "$UKC_METRO" --token "$UKC_TOKEN" \
            > "baseline-artifacts/${name}.log" 2>&1
          kraft cloud quota -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" \
            > baseline-artifacts/quota-after.json 2>&1

      - name: Cleanup baseline resources
        if: always() && inputs.cleanup_after_test
        shell: bash
        run: |
          set +e

          instance_exists() {
            local name="$1"
            kraft cloud instance get "$name" -o json \
              --metro "$UKC_METRO" --token "$UKC_TOKEN" >/dev/null 2>&1
          }

          volume_exists() {
            local name="$1"
            kraft cloud volume get "$name" -o json \
              --metro "$UKC_METRO" --token "$UKC_TOKEN" >/dev/null 2>&1
          }

          case "${{ inputs.target }}" in
            novnc-browser)
              if instance_exists baseline-novnc-browser; then
                kraft cloud instance remove baseline-novnc-browser \
                  --metro "$UKC_METRO" --token "$UKC_TOKEN" || true
              else
                echo "No baseline noVNC instance was created; skipping cleanup."
              fi
              ;;
            chromium-cdp-auth)
              if instance_exists baseline-chromium-cdp-auth; then
                kraft cloud instance remove baseline-chromium-cdp-auth \
                  --metro "$UKC_METRO" --token "$UKC_TOKEN" || true
                sleep 5
              else
                echo "No baseline CDP instance was created; skipping instance cleanup."
              fi
              if volume_exists baseline-cdp-auth-data; then
                kraft cloud volume remove baseline-cdp-auth-data \
                  --metro "$UKC_METRO" --token "$UKC_TOKEN" || true
              else
                echo "No baseline CDP volume was created; skipping volume cleanup."
              fi
              ;;
          esac
          exit 0

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-baseline-${{ inputs.target }}-${{ github.run_id }}
          path: |
            baseline-artifacts
            official-examples-revision.txt
          if-no-files-found: warn
          retention-days: 14
