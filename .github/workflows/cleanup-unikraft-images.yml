name: Cleanup Unikraft Images

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Cleanup mode
        required: true
        type: choice
        options:
          - dry-run
          - delete-project-images
          - delete-all-images
        default: dry-run
      wait_for_quota_refresh:
        description: Wait up to 15 minutes for image quota to refresh
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: unikraft-image-maintenance
  cancel-in-progress: false

env:
  UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
  UKC_METRO: ${{ vars.UKC_METRO || 'fra' }}
  KRAFTKIT_VERSION: "0.12.15"
  KRAFTKIT_NO_CHECK_UPDATES: "true"
  KRAFTKIT_NO_WARN_CLOUD_DEPRECATION: "1"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$UKC_TOKEN" || {
            echo "::error::UKC_TOKEN is not configured"
            exit 1
          }

      - name: Install pinned KraftKit
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="kraft_${KRAFTKIT_VERSION}_linux_${arch}.tar.gz"
          url="https://github.com/unikraft/kraftkit/releases/download/v${KRAFTKIT_VERSION}/${archive}"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl --fail --location --retry 3 --retry-all-errors -o "$tmpdir/$archive" "$url"
          tar -xzf "$tmpdir/$archive" -C "$tmpdir"
          source_bin="$(find "$tmpdir" -type f -name kraft -perm -111 | head -n 1)"
          test -n "$source_bin"
          install -d "$HOME/.local/bin"
          install -m 0755 "$source_bin" "$HOME/.local/bin/kraft"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          kraft version

      - name: Inventory images before cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p cleanup-artifacts
          kraft cloud quota -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" \
            | tee cleanup-artifacts/quota-before.json
          kraft cloud image list -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" \
            | tee cleanup-artifacts/images-before.json

      - name: Select and delete images
        if: inputs.mode != 'dry-run'
        shell: bash
        env:
          CLEANUP_MODE: ${{ inputs.mode }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' > cleanup-artifacts/delete-candidates.txt
          import json, os, re
          data = json.load(open('cleanup-artifacts/images-before.json'))
          candidates = []

          def walk(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key.lower() in {'name', 'url', 'tag', 'reference', 'image'} and isinstance(item, str):
                          candidates.append(item)
                      walk(item)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)

          walk(data)
          mode = os.environ['CLEANUP_MODE']
          project_names = ('cloak-browser', 'baseline-chromium-cdp-auth', 'baseline-novnc-browser')
          seen = set()
          for value in candidates:
              value = value.strip()
              if not value or value in seen:
                  continue
              if mode == 'delete-all-images' or any(name in value for name in project_names):
                  seen.add(value)
                  print(value)
          PY

          echo "Selected image references:"
          cat cleanup-artifacts/delete-candidates.txt

          if [[ ! -s cleanup-artifacts/delete-candidates.txt ]]; then
            echo "No visible image references matched. The occupied storage may be an uncommitted upload; wait for registry garbage collection."
            exit 0
          fi

          : > cleanup-artifacts/delete-results.txt
          while IFS= read -r image; do
            [[ -n "$image" ]] || continue
            echo "Deleting: $image" | tee -a cleanup-artifacts/delete-results.txt
            if kraft cloud image delete "$image" --metro "$UKC_METRO" --token "$UKC_TOKEN" \
                >> cleanup-artifacts/delete-results.txt 2>&1; then
              echo "Deleted: $image" | tee -a cleanup-artifacts/delete-results.txt
            else
              echo "Delete command failed for $image; continuing with other references." \
                | tee -a cleanup-artifacts/delete-results.txt
            fi
          done < cleanup-artifacts/delete-candidates.txt

      - name: Wait for quota refresh
        if: inputs.mode != 'dry-run' && inputs.wait_for_quota_refresh
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 15); do
            echo "Quota refresh check ${attempt}/15"
            kraft cloud quota -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" \
              | tee cleanup-artifacts/quota-latest.json
            sleep 60
          done

      - name: Inventory images after cleanup
        if: always()
        shell: bash
        run: |
          set +e
          kraft cloud quota -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" \
            | tee cleanup-artifacts/quota-after.json
          kraft cloud image list -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" \
            | tee cleanup-artifacts/images-after.json
          exit 0

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unikraft-image-cleanup-${{ inputs.mode }}-${{ github.run_id }}
          path: cleanup-artifacts
          if-no-files-found: warn
          retention-days: 14
