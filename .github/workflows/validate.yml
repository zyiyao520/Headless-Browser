name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          set -Eeuo pipefail
          bash -n scripts/entrypoint.sh
          bash -n scripts/healthcheck.sh
          bash -n scripts/open-tunnel.sh
      - name: Build OCI image
        run: docker build --tag headless-browser:test .
      - name: Enforce Unikraft Hobby image limit
        run: |
          set -Eeuo pipefail
          size=$(docker image inspect headless-browser:test --format='{{.Size}}')
          echo "Flattened Docker image size: $size bytes"
          limit=$((850 * 1024 * 1024))
          if (( size > limit )); then
            echo "::error::Image exceeds 850 MiB safety target for the 1 GiB Unikraft registry quota"
            exit 1
          fi
      - name: Smoke test container
        run: |
          set -Eeuo pipefail
          docker run -d --name browser-test \
            --shm-size=256m \
            -p 16080:6080 \
            -p 19222:9222 \
            headless-browser:test
          trap 'docker logs browser-test || true; docker rm -f browser-test || true' EXIT
          for i in $(seq 1 90); do
            if curl --connect-timeout 1 --max-time 3 -fsS http://127.0.0.1:16080/vnc.html >/dev/null 2>&1 && \
               curl --connect-timeout 1 --max-time 3 -fsS http://127.0.0.1:19222/json/version >/dev/null 2>&1; then
              echo "Browser stack is ready"
              exit 0
            fi
            if (( i % 10 == 0 )); then
              echo "Still waiting, attempt $i/90"
              docker ps --filter name=browser-test
              docker logs --tail 80 browser-test || true
              docker exec browser-test sh -lc '''
                echo "== processes =="
                ps aux || true
                echo "== listeners =="
                ss -lntp 2>/dev/null || netstat -lntp 2>/dev/null || true
                echo "== component logs =="
                for f in /data/logs/*.log; do
                  echo "--- $f ---"
                  tail -n 100 "$f" || true
                done
              ''' || true
            fi
            sleep 2
          done
          echo "Browser stack did not become ready"
          docker inspect browser-test --format='{{json .State}}' || true
          docker logs browser-test || true
          docker exec browser-test sh -lc '''
            for f in /data/logs/*.log; do
              echo "--- $f ---"
              cat "$f" || true
            done
          ''' || true
          exit 1
