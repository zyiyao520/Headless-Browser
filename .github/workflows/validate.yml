name: Validate Visual Browser

on:
  push:
    branches: [main]
    paths:
      - 'deploy/visual-cdp/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'deploy/visual-cdp/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-visual-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/visual-cdp/wrapper.sh
          bash -n deploy/visual-cdp/visual-entrypoint.sh

      - name: Validate Node.js proxy
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check deploy/visual-cdp/proxy.js

      - name: Validate YAML
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib
          import yaml

          for path in [
              pathlib.Path('deploy/visual-cdp/Kraftfile'),
              pathlib.Path('.github/workflows/deploy.yml'),
              pathlib.Path('.github/workflows/validate.yml'),
              pathlib.Path('.github/workflows/cleanup-unikraft-images.yml'),
          ]:
              with path.open(encoding='utf-8') as stream:
                  yaml.safe_load(stream)
              print(f'OK: {path}')
          PY

      - name: Check deployment invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq "headless: false" deploy/visual-cdp/proxy.js
          grep -Fq "launchPersistentContext('/app/data/profile'" deploy/visual-cdp/proxy.js
          grep -Fq "443:6080/http+tls" .github/workflows/deploy.yml
          grep -Fq "10000:8080/tls" .github/workflows/deploy.yml
          grep -Fq "chromium-cdp-auth-data:/app/data" .github/workflows/deploy.yml
          grep -Fq "timeout 30s kraft cloud instance logs" .github/workflows/deploy.yml
