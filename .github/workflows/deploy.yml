name: Deploy Remote Browser

on:
  workflow_dispatch:
    inputs:
      cleanup_old_image:
        description: Delete the previous application image before building
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: visual-browser-deploy
  cancel-in-progress: true

env:
  UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
  UKC_METRO: ${{ vars.UKC_METRO || 'fra' }}
  BOOTSTRAP_ADMIN_TOKEN: ${{ secrets.CDP_BOOTSTRAP_ADMIN_TOKEN }}
  VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
  KRAFTKIT_VERSION: "0.12.15"
  KRAFTKIT_NO_CHECK_UPDATES: "true"
  KRAFTKIT_NO_WARN_CLOUD_DEPRECATION: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate required secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$UKC_TOKEN" || { echo "::error::UKC_TOKEN is not configured"; exit 1; }
          test -n "$BOOTSTRAP_ADMIN_TOKEN" || { echo "::error::CDP_BOOTSTRAP_ADMIN_TOKEN is not configured"; exit 1; }
          test -n "$VNC_PASSWORD" || { echo "::error::VNC_PASSWORD is not configured"; exit 1; }

      - name: Install KraftKit
        shell: bash
        run: |
          set -Eeuo pipefail
          a=kraft_${KRAFTKIT_VERSION}_linux_amd64.tar.gz
          u=https://github.com/unikraft/kraftkit/releases/download/v${KRAFTKIT_VERSION}/$a
          d=$(mktemp -d)
          curl -fL --retry 3 -o "$d/$a" "$u"
          tar -xzf "$d/$a" -C "$d"
          install -d "$HOME/.local/bin"
          install -m 755 "$(find "$d" -type f -name kraft -perm -111 | head -1)" "$HOME/.local/bin/kraft"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Remove previous deployment resources and image
        shell: bash
        run: |
          set +e
          # Remove previous deployments before reusing the persistent volume.
          for instance in baseline-chromium-cdp-auth visual-chromium-cdp; do
            kraft cloud instance remove "$instance" \
              --metro "$UKC_METRO" --token "$UKC_TOKEN" >/dev/null 2>&1 || true
          done

          detached=0
          for i in $(seq 1 36); do
            v=$(kraft cloud volume list -o json --metro "$UKC_METRO" --token "$UKC_TOKEN")
            echo "$v"
            if ! echo "$v" | grep -Fq '"state":"mounted"'; then
              detached=1
              break
            fi
            sleep 5
          done
          if (( detached == 0 )); then
            echo "::error::Persistent volume remained mounted after removing old instances"
            exit 1
          fi

          if [[ "${{ inputs.cleanup_old_image }}" == "true" ]]; then
            images=$(kraft cloud image list -o json --metro "$UKC_METRO" --token "$UKC_TOKEN")
            echo "$images"
            for image in voss/baseline-chromium-cdp-auth voss/visual-chromium-cdp; do
              if echo "$images" | grep -Fq "\"name\":\"$image\""; then
                kraft cloud image delete "$image" \
                  --metro "$UKC_METRO" --token "$UKC_TOKEN" || true
              else
                echo "Image $image does not exist; skipping deletion."
              fi
            done
            sleep 60
          fi
      - name: Ensure persistent volume
        shell: bash
        run: |
          set -Eeuo pipefail
          j=$(kraft cloud volume list -o json --metro "$UKC_METRO" --token "$UKC_TOKEN")
          echo "$j"
          if ! echo "$j" | grep -Fq '"name":"chromium-cdp-auth-data"'; then
            kraft cloud volume create --name chromium-cdp-auth-data --size 256Mi --metro "$UKC_METRO" --token "$UKC_TOKEN"
          fi
          ready=0
          for i in $(seq 1 36); do
            j=$(kraft cloud volume list -o json --metro "$UKC_METRO" --token "$UKC_TOKEN")
            echo "$j"
            if echo "$j" | grep -Eq '"state":"(available|idle)"'; then ready=1; break; fi
            sleep 5
          done
          (( ready == 1 )) || { echo "::error::Volume is not attachable"; exit 1; }
      - name: Build and deploy visual browser
        working-directory: deploy/visual-cdp
        shell: bash
        run: |
          set -Eeuo pipefail
          kraft cloud deploy . \
            --metro "$UKC_METRO" \
            --token "$UKC_TOKEN" \
            --name visual-chromium-cdp \
            --memory 4Gi \
            --port '443:6080/http+tls' \
            --port '10000:8080/tls' \
            --volume 'chromium-cdp-auth-data:/app/data' \
            --env "BOOTSTRAP_ADMIN_TOKEN=$BOOTSTRAP_ADMIN_TOKEN" \
            --env "VNC_PASSWORD=$VNC_PASSWORD" \
            --restart on-failure \
            --rollout remove_sequential \
            --rollout-wait 90s \
            --output json

          # Obtain a clean controller response after deployment. KraftKit build
          # progress and deployment output are not guaranteed to form a JSON-only
          # stdout stream suitable for direct parsing.
          instance_json="$GITHUB_WORKSPACE/visual-instance-current.json"
          for attempt in $(seq 1 24); do
            kraft cloud instance get visual-chromium-cdp -o json \
              --metro "$UKC_METRO" --token "$UKC_TOKEN" \
              > "$instance_json" 2>/tmp/instance-get.err || true
            if [[ -s "$instance_json" ]] && python3 -m json.tool "$instance_json" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
      - name: Wait for public endpoints
        shell: bash
        run: |
          set -Eeuo pipefail
          result="$GITHUB_WORKSPACE/visual-instance-current.json"
          if [[ ! -s "$result" ]]; then
            echo "::error::Instance query result is missing or empty"
            cat /tmp/instance-get.err 2>/dev/null || true
            exit 1
          fi
          if ! python3 -m json.tool "$result" >/dev/null 2>&1; then
            echo "::error::Instance query result is not valid JSON"
            cat "$result"
            exit 1
          fi
          fqdn=$(python3 -c "import json,sys; o=json.load(open(sys.argv[1])); i=o.get('data',{}).get('instances',[]); assert i; d=i[0].get('service_group',{}).get('domains',[]); assert d and d[0].get('fqdn'); print(d[0]['fqdn'])" "$result")
          echo "Visual browser FQDN: $fqdn"
          novnc_ready=0
          cdp_ready=0
          for attempt in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 5 -fsS "https://${fqdn}/vnc.html" >/dev/null 2>&1; then
              novnc_ready=1
            fi
            code=$(curl --connect-timeout 2 --max-time 5 -sS -o /tmp/cdp-health.out -w '%{http_code}' \
              "https://${fqdn}:10000/json/version" || true)
            if [[ "$code" == "401" ]]; then
              cdp_ready=1
            fi
            echo "Readiness ${attempt}/60: noVNC=${novnc_ready}, CDP-auth=${cdp_ready}, HTTP=${code}"
            if (( novnc_ready == 1 && cdp_ready == 1 )); then
              echo "Visual browser endpoints are ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Visual browser endpoints did not become ready"
          cat /tmp/cdp-health.out 2>/dev/null || true
          exit 1

      - name: Capture status and bounded logs
        if: always()
        shell: bash
        run: |
          set +e
          kraft cloud instance get visual-chromium-cdp -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" | tee visual-instance.json
          timeout 30s kraft cloud instance logs visual-chromium-cdp --metro "$UKC_METRO" --token "$UKC_TOKEN" > visual-instance.log 2>&1 || true
          kraft cloud image list -o json --metro "$UKC_METRO" --token "$UKC_TOKEN" > visual-images.json 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-browser-${{ github.run_id }}
          path: visual-*
          retention-days: 14
